name: Publish

# Phase 8.4: build, run the full suite once more, publish to npm with provenance.
# Triggers: any push to main where packages/plugin's version differs from npm
# ("merge = release/stage" — the version bump in a PR is the release intent), plus
# manual dispatch as first-release path and kill-switch fallback.
# dist-tag + GitHub release live in post-release.yml (idempotent), decoupled so the
# pipeline also works with npm's STAGED flow (decision #12): stage here, maintainer
# promotes with 2FA on npm, post-release finishes tagging.
#
# Auth: npm TRUSTED PUBLISHING (OIDC) — no tokens anywhere. The trusted publisher is
# configured on npmjs.com for this repo + this workflow file (stage-publish only,
# "require 2FA and disallow tokens"). This workflow STAGES the version; the maintainer
# approves with `npm stage approve <stage-id> --otp=<code>`; post-release.yml then
# creates the GitHub release and surfaces the strapi-5.x dist-tag one-liner.

on:
  push:
    branches: [main]
    paths:
      - 'packages/plugin/**'
      - 'drift/manifest.json'
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_publish: ${{ steps.compare.outputs.should_publish }}
      version: ${{ steps.compare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: compare
        run: |
          VERSION=$(node -p "require('./packages/plugin/package.json').version")
          PUBLISHED=$(npm view strapi-plugin-breakout-kit version 2>/dev/null || echo "none")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" = "$PUBLISHED" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION already on npm — nothing to do."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "Will publish $VERSION (npm has: $PUBLISHED)."
          fi

  publish:
    needs: check
    if: needs.check.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # NOTE: no registry-url here — setup-node's registry-url writes an .npmrc that
      # expects NODE_AUTH_TOKEN, which breaks OIDC trusted publishing (empty auth is
      # sent instead of the OIDC exchange; npm masks it as E404 on publish).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Prepare playground
        run: node apps/playground/scripts/make-env.js && mkdir -p apps/playground/.tmp && npm run seed

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Contract & parity tests
        run: npm run test:contract

      - name: Upgrade npm (OIDC trusted publishing needs a newer npm than node22 bundles)
        run: npm install -g npm@latest && npm --version

      - name: Stage on npm (OIDC trusted publishing; provenance automatic)
        # The trusted publisher allows STAGE publish only (post-2026 default; direct
        # `npm publish` is refused and surfaces as ENEEDAUTH). Run from the package
        # dir, not via `-w` (workspace path skips the OIDC exchange).
        working-directory: packages/plugin
        run: |
          npm stage publish --loglevel verbose 2>npm-verbose.log || {
            echo '--- last 80 verbose lines ---'
            tail -n 80 npm-verbose.log || true
            echo '--- oidc/http lines ---'
            (grep -ihE "oidc|exchange|id.?token|trusted|audience|http fetch|401|403|404" npm-verbose.log || true) | tail -n 40
            exit 1
          }
          cat npm-verbose.log
          {
            echo "## Staged on npm — awaiting 2FA approval"
            echo
            echo '```'
            npm stage list 2>/dev/null || true
            echo '```'
            echo
            echo 'Approve with: `npm stage approve <stage-id> --otp=<code>` — then apply the dist-tag (see post-release run summary).'
          } >> "$GITHUB_STEP_SUMMARY"

