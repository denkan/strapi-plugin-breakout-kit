name: Publish

# Phase 8.4: build, run the full suite once more, publish to npm with provenance.
# Triggers: any push to main where packages/plugin's version differs from npm
# ("merge = release/stage" — the version bump in a PR is the release intent), plus
# manual dispatch as first-release path and kill-switch fallback.
# dist-tag + GitHub release live in post-release.yml (idempotent), decoupled so the
# pipeline also works with npm's STAGED flow (decision #12): stage here, maintainer
# promotes with 2FA on npm, post-release finishes tagging.
#
# Migration plan (decision #12): NPM_TOKEN is BOOTSTRAP-ONLY for the first publish.
# After 0.1.0 is live: configure a Trusted Publisher on npmjs.com for this repo +
# workflow ("require 2FA and disallow tokens", staged publishing), swap the publish
# step to OIDC (drop NODE_AUTH_TOKEN; may need npm@latest for OIDC support), and
# revoke/delete the NPM_TOKEN secret.

on:
  push:
    branches: [main]
    paths:
      - 'packages/plugin/**'
      - 'drift/manifest.json'
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_publish: ${{ steps.compare.outputs.should_publish }}
      version: ${{ steps.compare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: compare
        run: |
          VERSION=$(node -p "require('./packages/plugin/package.json').version")
          PUBLISHED=$(npm view strapi-plugin-breakout-kit version 2>/dev/null || echo "none")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" = "$PUBLISHED" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION already on npm — nothing to do."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "Will publish $VERSION (npm has: $PUBLISHED)."
          fi

  publish:
    needs: check
    if: needs.check.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Prepare playground
        run: node apps/playground/scripts/make-env.js && mkdir -p apps/playground/.tmp && npm run seed

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Contract & parity tests
        run: npm run test:contract

      - name: Publish to npm (provenance)
        run: npm publish -w packages/plugin --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

