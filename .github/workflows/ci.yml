name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Prepare playground env
        run: node apps/playground/scripts/make-env.js && mkdir -p apps/playground/.tmp

      - name: Seed playground
        run: npm run seed

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Contract & parity tests
        run: npm run test:contract

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7
