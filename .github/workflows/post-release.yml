name: Post-release

# Idempotent finisher decoupled from the publish path, so it works with BOTH direct
# publish and npm's staged flow (stage in CI -> maintainer promotes with 2FA in npm):
# once the current packages/plugin version is LIVE on npm, ensure
#   - the strapi-5.x dist-tag points at it (per the drift manifest's tested version)
#   - the GitHub release exists
# Runs after Publish, on manual dispatch (right after promoting a staged release),
# and on a daily self-heal cron.

on:
  workflow_run:
    workflows: [Publish]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '43 7 * * *'

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync GitHub release; surface pending dist-tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./packages/plugin/package.json').version")
          STRAPI=$(node -p "require('./drift/manifest.json').strapiVersion")
          MINOR="strapi-${STRAPI%.*}"
          LIVE=$(npm view "strapi-plugin-breakout-kit@${VERSION}" version 2>/dev/null || echo "")
          if [ "$LIVE" != "$VERSION" ]; then
            echo "Version $VERSION is not live on npm (staged or unpublished) — nothing to do."
            exit 0
          fi
          if ! gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release create "v${VERSION}" --title "v${VERSION}" --notes \
              "strapi-plugin-breakout-kit ${VERSION} — tested against Strapi ${STRAPI} (window: see peerDependencies). See packages/plugin/CHANGELOG.md."
            echo "GitHub release v${VERSION} created"
          fi
          # dist-tags are 2FA-gated writes ("disallow tokens"), so CI cannot apply them.
          CURRENT_TAG=$(npm view "strapi-plugin-breakout-kit" "dist-tags.${MINOR}" 2>/dev/null || echo "")
          if [ "$CURRENT_TAG" != "$VERSION" ]; then
            {
              echo "## Manual step pending"
              echo
              echo "Run (with a fresh OTP):"
              echo '```'
              echo "npm dist-tag add strapi-plugin-breakout-kit@${VERSION} ${MINOR} --otp=<code>"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::dist-tag ${MINOR} still points at '${CURRENT_TAG}' — apply manually (see run summary)."
          fi
